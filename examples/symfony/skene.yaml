name: symfony-app
fleet_name: symfony
orbit:
  link: {max_in_flight: 128, max_waiting: 192}
workers: 8
requests:
  max_body_size: 64 MiB
  body_read_timeout: 30s
responses:
  idle_timeout: 60s
php:
  engine:
    warmup: [app, var/cache/prod, vendor/symfony]
  lifecycle:
    graceful_timeout: null
    execution_timeout: 30s
  application:
    script_path: application.php
    env:
      APP_ENV: prod
      APP_DEBUG: "0"
    instances: 8
    max_waiting: 256
    retry:
      max_attempts: null
      backoff: 1s
      backoff_max: 10s
