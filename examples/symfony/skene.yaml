name: symfony-app
fleet_name: symfony
orbit: true
workers: 8
max_in_flight: 128
max_concurrent_requests: 128
requests:
  max_body_size: 64 MiB
  body_read_timeout: 30s
  head_timeout: 60s
responses:
  body_idle_timeout: 60s
php:
  engine:
    warmup: [app, var/cache/prod, vendor/symfony]
  lifecycle:
    graceful_timeout: null
    execution_timeout: 30s
  application:
    script_path: application.php
    env:
      APP_ENV: prod
      APP_DEBUG: "0"
    pool:
      min_idle: 1
      max_idle: 1
      max_size: 8
      idle_timeout: 60s
      max_life: 5m
      max_requests: 1000
      maintenance_interval: 100ms
      max_waiting: 256
    retry:
      max_attempts: null
      backoff: 1s
      backoff_max: 10s
