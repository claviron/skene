[package]
name = "skene"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Symfony application runner for Claviron"
repository = "https://github.com/claviron/skene"
keywords = ["symfony", "php", "application-server", "orbit", "async"]
categories = ["web-programming::http-server", "asynchronous"]
include = ["/src/**", "/tests/**", "/README.md", "/ARCHITECTURE.md", "/LICENSE"]

[workspace]
resolver = "3"

[features]
default = ["cli", "supervisor"]
cli = ["dep:clap", "claviron-runner/cli"]
supervisor = ["claviron-runner/supervisor"]
files = ["claviron/files"]
axum = ["claviron-runner/axum"]

[dependencies]
claviron = { version = "0.2.1", default-features = false }
claviron-runner = { version = "0.2.1", default-features = false, features = ["socket", "orbit"] }
claviron-php = { version = "0.2.0-alpha.26", features = ["embed"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "skene"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
